name: release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows-x64:
    runs-on: windows-latest
    env:
      PYTHONUTF8: "1"
      PYTHONIOENCODING: utf-8
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12 (Windows x64)
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          architecture: "x64"

      - name: Install runtime and build dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-build.txt
          pip check

      - name: Run unit tests
        shell: pwsh
        run: |
          python -B -m unittest discover -s tests -v

      - name: Build portable onedir executable
        shell: pwsh
        run: |
          pyinstaller --clean --noconfirm AirPlayTray.spec

      - name: Verify built executable with offline self-check
        shell: pwsh
        run: |
          $exe = Join-Path $PWD "dist\AirPlayTray\AirPlayTray.exe"
          Push-Location $env:RUNNER_TEMP
          try {
            $proc = Start-Process -FilePath $exe -ArgumentList "--self-check" -Wait -PassThru -NoNewWindow
            if ($proc.ExitCode -ne 0) {
              throw "AirPlayTray.exe --self-check failed with exit code $($proc.ExitCode)"
            }
          } finally {
            Pop-Location
          }
          $dataDir = Join-Path $PWD "dist\AirPlayTray\data"
          if (-not (Test-Path $dataDir)) {
            throw "Expected writable data directory was not created at $dataDir"
          }
          Remove-Item -Recurse -Force $dataDir

      - name: Bundle docs, startup helper, and third-party licenses
        shell: pwsh
        run: |
          $stage = Join-Path $PWD "dist\AirPlayTray"
          python build_tools\collect_licenses.py --lock requirements-lock.txt --output (Join-Path $stage "licenses")
          foreach ($file in @("README.md", "README.zh-CN.md", "LICENSE", "THIRD_PARTY.md", "enable-startup.ps1")) {
            Copy-Item $file (Join-Path $stage $file) -Force
          }

      - name: Package portable ZIP and SHA256SUMS
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path release | Out-Null
          $zip = Join-Path $PWD "release\AirPlayTray-win-x64.zip"
          Compress-Archive -Path (Join-Path $PWD "dist\AirPlayTray") -DestinationPath $zip -Force
          $hash = (Get-FileHash -Path $zip -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  AirPlayTray-win-x64.zip" | Out-File -FilePath (Join-Path $PWD "release\SHA256SUMS.txt") -Encoding ascii -NoNewline
          Get-Content (Join-Path $PWD "release\SHA256SUMS.txt")

      - name: Upload workflow build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: AirPlayTray-win-x64
          path: |
            release/AirPlayTray-win-x64.zip
            release/SHA256SUMS.txt

      - name: Create Draft GitHub Release on tag push
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          generate_release_notes: true
          files: |
            release/AirPlayTray-win-x64.zip
            release/SHA256SUMS.txt
